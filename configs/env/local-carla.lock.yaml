kind: local-carla
carla:
  version: "0.9.16"
  engine: "Unreal Engine 4.26（**不是** UE5）"
  root: 'F:\CARLA'
  launcher: 'F:\CARLA\CarlaUE4.exe'                                  # 0.2 MB，转发到 Shipping 版
  server_binary: 'F:\CARLA\CarlaUE4\Binaries\Win64\CarlaUE4-Win64-Shipping.exe'   # 87.2 MB
  install_method: "官方预编译包 ZIP 解压（非源码编译）"
  source_url: 'https://downloads.carlasim.com/Windows/CARLA_0.9.16.zip'
  zip_kept: 'F:\CARLA_download\CARLA_0.9.16.zip'
  zip_size_mb: 7450
  extracted_gb: 18.07
  entries: 32841
  disk_after: "F: 剩余 365.8 GB"

download_record:
  authorized_by: "用户 2026-10-11（选择'下 CARLA 到 F: 并冒烟'）"
  speed_note: >-
    本机到国际源实测 0.04–0.5 MB/s；ghproxy 类镜像不通；官方直链最快且支持断点续传
    （实测峰值约 1.5 MB/s，波动大）。7450 MB 耗时约 1 小时。**备份渠道**：
    Backblaze（carla-releases.s3.us-east-005.backblazeb2.com）与 GitHub Releases
    指向同一文件，但实测更慢或不通。
  resume_supported: true

extraction_note: >-
  `tar -xf` 报大量 "Can't restore time: Invalid argument" 并返回 exit=1。
  原因：目标盘 F: 是 **exFAT**，不支持 Unix 时间戳/权限恢复；**文件内容不受影响**。
  判据：条目数 32841 与预期一致、主程序与 PythonAPI 均存在、服务端实测可启动。

