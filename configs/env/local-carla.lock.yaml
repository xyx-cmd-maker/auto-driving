    - "B：用现有 Python 3.13 + 源码方式（需 CARLA 源码编译 libcarla，代价大、耗时长，不推荐）。"
    - "C：暂不装客户端——服务端已可独立运行与观察（桌面快捷方式），但**无法用 Python 做闭环实验**。"
