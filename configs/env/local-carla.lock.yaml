# CARLA 环境锁（2026-10-11 安装并实测启动）
# 与 local-gpu.lock.yaml 的关系：本文件记录仿真器侧；GPU/torch 侧见该文件。

kind: local-carla
carla:
  version: "0.9.16"
  engine: "Unreal Engine 4.26（**不是** UE5）"
  root: 'F:\CARLA'
  launcher: 'F:\CARLA\CarlaUE4.exe'                                  # 0.2 MB，转发到 Shipping 版
  server_binary: 'D:\CARLA\CarlaUE4\Binaries\Win64\CarlaUE4-Win64-Shipping.exe'   # 87.2 MB
  install_method: "官方预编译包 ZIP 解压（非源码编译）"
  source_url: 'https://downloads.carlasim.com/Windows/CARLA_0.9.16.zip'
  # ── F: 上那份的安排（2026-10-11 决定，基于实测；用户问"F 盘 CARLA 怎么安排"）──
  # 事实：两份副本经 `robocopy /L` 比对**逐文件完全一致**（差异 0 文件 / 0 字节），
  #       关键文件 SHA256 前 16 位相同（CarlaUE4.exe、Shipping.exe、客户端 wheel）。
  #       ⇒ F: 上的解压副本是**纯冗余**。
  # 决定：**删除解压副本，保留压缩包**作为灾难恢复备份。
  # 理由：① 恢复能力与解压副本**等价**（解压仅约 7 分钟）；
  #       ② zip 唯一优势是省一次约 1 小时的下载（国际源实测 0.04–1.5 MB/s）；
  #       ③ 净省 18 GB；④ zip 可哈希校验完整性，解压副本被静默写坏时更难发现；
  #       ⑤ "备份"的价值在能恢复，不在它是文件夹。
  backup:
    kept_zip: 'F:\CARLA_download\CARLA_0.9.16.zip'
    zip_size_mb: 7450
    zip_sha256: '0972f26fa3f1c741fbfcb4602b4ccf520415b8f8cf3d06cb83c9502fe8118bd2'
    zip_verified: "已实测：ZIP 可打开、32841 条目与在用副本一致、三个关键条目字节数相符"
    deleted_f_copy: 'F:\CARLA（已删，实测释放 47.33 GB）'
    restore_steps: "解压 zip 到 D:\\CARLA 即可（约 7 分钟）；再按 desktop 快捷方式重建 3 个 .lnk；无需重装 Python 3.12 与 wheel（二者在 C:）"
  zip_kept: 'F:\CARLA_download\CARLA_0.9.16.zip'
  zip_size_mb: 7450
  extracted_gb: 18.07
  entries: 32841
  disk_after: "D: 剩余 28.7 GB；F: 剩余 413.1 GB（删冗余副本后）"

download_record:
  authorized_by: "用户 2026-10-11（选择'下 CARLA 到 F: 并冒烟'）"
  speed_note: >-
    本机到国际源实测 0.04–0.5 MB/s；ghproxy 类镜像不通；官方直链最快且支持断点续传
    （实测峰值约 1.5 MB/s，波动大）。7450 MB 耗时约 1 小时。**备份渠道**：
    Backblaze（carla-releases.s3.us-east-005.backblazeb2.com）与 GitHub Releases
    指向同一文件，但实测更慢或不通。
  resume_supported: true

extraction_note: >-
  `tar -xf` 报大量 "Can't restore time: Invalid argument" 并返回 exit=1。
  原因：目标盘 F: 是 **exFAT**，不支持 Unix 时间戳/权限恢复；**文件内容不受影响**。
  判据：条目数 32841 与预期一致、主程序与 PythonAPI 均存在、服务端实测可启动。

# ── 验证记录（2026-10-11 实测）──
verified:
  server_launch:
    command: 'F:\CARLA\CarlaUE4.exe -quality-level=Low -windowed -carla-port=2000'
    result: "✅ 成功：29 秒内 2000 端口就绪；GPU 显存占用 3924 MiB（证明渲染在 GPU 上）；观察到 CarlaUE4-Win64-Shipping 子进程"
    note: "低画质模式为省显存；默认画质另建快捷方式"
  desktop_shortcuts: ['CARLA 0.9.16 (低画质).lnk', 'CARLA 0.9.16 (默认画质).lnk', 'CARLA 目录.lnk']
  town04_present_expected: true     # HDMaps/Town04.pcd 已随包解压；待 Python 客户端连通后逐项确认
  smoke_script: scripts/smoke/check_carla_env.py

# ── ✅ 客户端已打通（2026-10-11，用户批准后安装 Python 3.12）──
python_client:
  bundled_wheel: 'F:\CARLA\PythonAPI\carla\dist\carla-0.9.16-cp312-cp312-win_amd64.whl'
  required_python: "3.12（wheel 标签 cp312）"
  host_pythons_before: ["3.14（主用）", "3.13", "3.13t", "Anaconda 3.9"]
  attempts:
    - "① Python 3.14 直接装原 wheel → ❌ pip 拒：'not a supported wheel on this platform'"
    - "② 改标签为 cp313 装进 3.13 → pip 装成功，但 `import carla` 报 `ModuleNotFoundError: No module named 'carla.libcarla'`（ABI 不兼容）。**试错后已 pip uninstall 清理**"
    - "③ ✅ **装 Python 3.12.10 后成功**（见下）"
  installed_python:
    version: "3.12.10"
    interpreter: 'C:\Users\<user>\AppData\Local\Programs\Python\Python312\python.exe'
    launcher: "py -3.12"
    installer: '~\Downloads\python-3.12.10-amd64.exe（25.7 MB）'
    installer_signature: "Authenticode **Valid**，签名者 CN=Python Software Foundation（Microsoft ID Verified CS AOC CA 01 颁发）"
    install_flags: "InstallAllUsers=0 PrependPath=1 Include_launcher=1 Include_test=0 Include_doc=0 SimpleInstall=1"
    verification: "`py --list` 已注册 3.12；**主用 3.14 不受影响**（`python` 仍为 3.14.4，torch 2.11.0+cu128、cuda=True 均正常）"
    version_note: >-
      3.12.11–3.12.15 **只有源码包、无 Windows 安装器**（3.12 已进入仅安全修复阶段），
      实测逐个 HEAD 探测：3.12.15/14/13/12/11 均 HTTP 404，**3.12.10 是最新可用安装器**。
  client_install:
    command: 'py -3.12 -m pip install --no-deps F:\CARLA\PythonAPI\carla\dist\carla-0.9.16-cp312-cp312-win_amd64.whl && py -3.12 -m pip install numpy'
    notes: "carla 包没有 __version__ 属性（正常）；顶层导出含 Client / VehicleControl / BlueprintLibrary 等；numpy 为运行依赖，已装"
  smoke_test:
    command: 'py -3.12 scripts/smoke/check_carla_env.py --exe F:\CARLA\CarlaUE4.exe --kill-after --wait 150'
    result: "✅ **8/8 全部通过**"
    evidence:
      - "import-carla：成功（site-packages\\carla）"
      - "server-exe：找到 F:\\CARLA\\CarlaUE4.exe（18.07 GB 目录）"
      - "server-start + port-ready：**25 秒**内 2000 端口就绪"
      - "client-connect：**已连接**，默认地图 `Carla/Maps/Town10HD_Opt`，仿真时间 3.2 s"
      - "**town04-present：可用地图 13 张，Town04 在 ✓（P1 的目标地图可用）**"
      - "server-stop：已关闭；**另有 CarlaUE4-Win64-Shipping 子进程需手动清理**（脚本只 terminate launcher）"
    cleanup_note: "冒烟后残留 CarlaUE4-Win64-Shipping（约 1.29 GB 内存）需 `Stop-Process` 显式清理；已在流程中记录"
  open_questions:
    - "CARLA 首次换图会下载 Nav/OpenDrive/TM 缓存（冒烟日志可见），换 Town04 的耗时未单独测量"
    - "8 GiB 显存下 CARLA 与训练同时运行的余量未测（CARLA 低画质静态约 3.9 GiB）"

weather: n/a

open_questions:
  - "8 GiB 显存运行 CARLA + 训练是否够用：CARLA 低画质静态占用约 3.9 GiB，**训练时余量未测**。"
  - "F: 为 exFAT：CARLA 运行不受影响，但若将来要存 >4 GB 单文件或需要符号链接，需注意。"
  - "USB 带宽是否拖慢载图：服务端启动 29 秒（可接受）；**换图（Town04 等）耗时未测**。"
