  required_python: "3.12（wheel 标签 cp312）"
  host_pythons: ["3.14（主用，C:\\Python314）", "3.13", "3.13t（freethreaded）", "Anaconda 3.9（2022.10）"]
  attempts:
    - "① Python 3.14 直接装原 wheel → ❌ 被 pip 拒绝：'not a supported wheel on this platform'"
    - "② 改标签为 cp313 装进 Python 3.13 → pip 安装成功，但 `import carla` 报 `ModuleNotFoundError: No module named 'carla.libcarla'`（ABI 不兼容，扩展模块无法加载）。**试错后已 pip uninstall 清理**"
  conclusion: "**必须 Python 3.12**：cp312 wheel 在 3.13/3.14 下均不可用，改标签无效。"
